name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          arch: 'win64_mingw'
          cache: true
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@refs/pull/1000/head

      - name: Install Ninja
        run: choco install ninja -y

      - name: Build vendored CGNS/HDF5 stack
        shell: pwsh
        run: |
          $qtBin = Join-Path $env:QT_ROOT_DIR 'bin'
          $mingwBin = Join-Path (Split-Path (Split-Path $env:QT_ROOT_DIR -Parent) -Parent) 'Tools/mingw1310_64/bin'
          if (-not (Test-Path $mingwBin)) {
            $found = Get-Command g++ -ErrorAction SilentlyContinue
            if ($found) { $mingwBin = Split-Path $found.Source -Parent }
          }
          if (-not (Test-Path $mingwBin)) { Write-Error "MinGW compiler not found for vendored build"; exit 1 }
          "$qtBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$mingwBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$qtBin;$mingwBin;$env:PATH"
          python tools/build_vendored_deps.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure (Ninja)
        # The release job builds the application only. The test suite links far
        # more Qt targets and its CTest discovery step executes each freshly
        # linked test binary during the build; on this runner that resolves the
        # MinGW runtime from a different toolchain than the one Qt was built
        # with and the executable dies at load time (0xc0000139). Tests belong
        # in their own job, not in the packaging path.
        shell: pwsh
        run: |
          $prefix = "${{ github.workspace }}/build-vendored-lib/install"
          $qtRoot = $env:QT_ROOT_DIR.Replace('\','/')
          cmake -G Ninja -S . -B build-release `
            -DCMAKE_BUILD_TYPE=Release `
            -DSCIRENDER_BUILD_TESTS=OFF `
            "-DCMAKE_PREFIX_PATH=$prefix;$qtRoot" `
            "-DZLIB_ROOT=$prefix" 2>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path configure.log -Pattern 'CGNS mesh import ENABLED')) {
            Write-Error 'CGNS support did not enable in the release configure'
            exit 1
          }

      - name: Build
        run: cmake --build build-release -j4

      - name: Stage package
        run: cmake --install build-release --prefix package

      - name: Run windeployqt
        run: |
          $windeployqt = (Get-Command windeployqt -ErrorAction SilentlyContinue).Source
          if (-not $windeployqt) { Write-Error "windeployqt not on PATH. Check install-qt-action output."; exit 1 }
          & $windeployqt --release --no-translations --compiler-runtime package/SciRender.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Copy correct MinGW runtime DLLs
        run: |
          $packageDir = "package"
          $mingwBin = Split-Path (Get-Command g++ -ErrorAction SilentlyContinue).Source -Parent
          if (-not $mingwBin) { $mingwBin = "$env:QT_ROOT_DIR\..\..\Tools\mingw1310_64\bin" }
          if (-not (Test-Path $mingwBin)) { Write-Error "Cannot find MinGW bin directory"; exit 1 }
          foreach ($dll in @("libstdc++-6.dll", "libgcc_s_seh-1.dll", "libwinpthread-1.dll", "libgomp-1.dll")) {
            $src = Join-Path $mingwBin $dll
            if (Test-Path $src) { Copy-Item $src $packageDir -Force } else { Write-Warning "Missing: $src" }
          }

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if (-not $version -or $version -eq "") { $version = "0.1.0" }
          $version = $version.TrimStart('v')
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Push-Location installer
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "SciRender.iss" "/DAppVersion=$version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

      - name: Create portable ZIP
        shell: pwsh
        run: |
          if (Test-Path dist/SciRender-win64.zip) { Remove-Item dist/SciRender-win64.zip }
          Compress-Archive -Path package/* -DestinationPath dist/SciRender-win64.zip -Force

      - name: Upload Release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SciRender-Setup.exe
            dist/SciRender-win64.zip
          fail_on_unmatched_files: true
