<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 6 24 24" width="32" height="32">
  <!-- Y-Axis (pointing left) -->
  <line x1="22" y1="26" x2="11" y2="26" stroke="#33FF33" stroke-width="2" stroke-linecap="round"/>
  <polygon points="11,23 6,26 11,29" fill="#33FF33"/>

  <!-- Z-Axis (pointing up) -->
  <line x1="22" y1="26" x2="22" y2="13" stroke="#4D80FF" stroke-width="2" stroke-linecap="round"/>
  <polygon points="19,13 22,8 25,13" fill="#4D80FF"/>

  <!-- Origin / -X viewpoint indicator -->
  <circle cx="22" cy="26" r="3.5" fill="#FF3333"/>
  <text x="5" y="18" fill="#FF3333" font-family="Arial,sans-serif" font-size="12">-X</text>
</svg>
